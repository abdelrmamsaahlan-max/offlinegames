<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f4f6fc">
  <meta name="description" content="Pocket Party — quick, colorful offline-style mini-games for 1–4 players on one screen.">
  <title>Pocket Party — One phone. Four players.</title>
  <link rel="icon" href="/assets/pocket_party_icon.svg" type="image/svg+xml">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="ambient ambient-one"></div>
  <div class="ambient ambient-two"></div>
  <header class="topbar">
    <a class="brand" href="/" aria-label="Pocket Party home">
      <span class="brand-mark"><svg viewBox="0 0 48 48" aria-hidden="true"><rect x="4" y="4" width="40" height="40" rx="13" fill="currentColor"/><path d="M13 23h22M24 12v22" stroke="#fff" stroke-width="5" stroke-linecap="round"/><circle cx="34" cy="13" r="4" fill="#ffe16b"/><circle cx="13" cy="35" r="3" fill="#ff7188"/></svg></span>
      <span class="brand-copy"><strong>pocket<span>party</span></strong><small>PASS THE PHONE. START THE CHAOS.</small></span>
    </a>
    <div class="topbar-right">
      <span class="offline-pill"><i></i> NO WI-FI NEEDED</span>
      <button class="icon-button sound-toggle" id="sound-toggle" aria-label="Toggle sound" title="Toggle sound">♫</button>
    </div>
  </header>

  <main id="app-root">
    <noscript>This game needs JavaScript enabled in your browser.</noscript>
    <section class="loading-state"><div class="loader"></div><span>Getting the party ready…</span></section>
  </main>

  <footer class="site-footer">
    <span>POCKET PARTY <b>·</b> BUILT FOR REMATCHES</span>
    <span class="footer-right">No accounts. No chat. Just play.</span>
  </footer>
  <script src="/game.js" defer></script>
</body>
</html>
